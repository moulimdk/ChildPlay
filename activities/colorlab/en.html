<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧪 Color Lab!</title>

<!--
  PURPOSE OF THIS FILE:
  Self-contained "Color Lab" activity (English) for preschoolers. Four modes from a small menu:
  - Mix Paint: tap two paint pots (red, yellow, blue) and watch them mix in the bowl ("Red and yellow make orange!").
  - What Will It Make?: a mixing question with three answers to choose from.
  - Opposite Friends: a color wheel; tap a color and its complementary "opposite friend" lights up.
  - Opposite Match: "Which color is the opposite friend of orange?" with three answers.
  Mix results and opposite pairs are defined explicitly (paint-style mixing, red/yellow/blue wheel), not computed.
  Uses ../../css/common_ui.css for shared styling and the Web Speech API for voice.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/common_ui.css">

<style>
  .page { width: 100%; max-width: 760px; flex: 1; display: flex; flex-direction: column; gap: 14px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .screen-title {
    font-family: 'Lilita One', cursive;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--red);
    text-shadow: 3px 3px 0 var(--yellow), 4px 4px 0 var(--ink);
    text-align: center;
  }

  .view { display: none; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .view.active { display: flex; }

  /* menu */
  .mode-card {
    width: 100%;
    display: flex; align-items: center; gap: 16px;
    background: var(--paper);
    border: 5px solid var(--ink);
    border-radius: 24px;
    box-shadow: 0 7px 0 var(--ink);
    padding: 14px 20px;
    font-family: 'Lilita One', cursive;
    font-size: clamp(1.3rem, 5vw, 1.9rem);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .mode-card .emoji { font-size: 2.4rem; }
  .mode-card small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: #8a7560; }
  .mode-card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
  .mode-card.m1 { background: var(--tile1); }
  .mode-card.m2 { background: var(--tile2); }
  .mode-card.m3 { background: var(--tile3); }
  .mode-card.m4 { background: #FFF1CC; }

  .prompt {
    width: 100%;
    text-align: center;
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--ink);
    padding: 10px 16px;
    font-family: 'Lilita One', cursive;
    font-size: clamp(1.3rem, 5.5vw, 2rem);
  }
  .prompt b { padding: 0 10px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; }

  .progress { display: flex; gap: 8px; justify-content: center; }
  .pip { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; transition: background 0.2s; }
  .pip.on { background: var(--green); }

  /* paint pots */
  .pots { display: flex; gap: 14px; justify-content: center; width: 100%; }
  .pot {
    flex: 1; max-width: 200px;
    border: 5px solid var(--ink);
    border-radius: 24px 24px 36px 36px;
    box-shadow: 0 6px 0 var(--ink);
    background: var(--sw);
    color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    min-height: 110px;
    font-family: 'Lilita One', cursive;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .pot .e { font-size: 2.4rem; line-height: 1; }
  .pot .n { font-size: 1.3rem; letter-spacing: 1px; }
  .pot:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .pot.picked { outline: 6px solid var(--yellow); outline-offset: 2px; }

  /* mixing equation */
  .equation {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    font-family: 'Lilita One', cursive;
    font-size: clamp(1.8rem, 8vw, 3rem);
  }
  .blob {
    width: clamp(70px, 22vw, 110px); aspect-ratio: 1;
    border: 5px solid var(--ink);
    border-radius: 50% 50% 46% 54% / 54% 46% 54% 46%;
    background: var(--sw, #fff);
    color: var(--fg, var(--ink));
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.8rem, 8vw, 3rem);
    box-shadow: 0 5px 0 var(--ink);
  }
  .blob.empty { background: repeating-linear-gradient(45deg, #fff, #fff 8px, #f1ead6 8px, #f1ead6 16px); border-style: dashed; box-shadow: none; }
  .blob.result { width: clamp(90px, 28vw, 140px); }
  .blob.mixing { animation: swirl 0.9s ease-in-out; }
  @keyframes swirl {
    0%   { transform: scale(0.4) rotate(0); }
    60%  { transform: scale(1.2) rotate(240deg); }
    100% { transform: scale(1) rotate(360deg); }
  }
  .result-name {
    min-height: 2.4rem; text-align: center;
    font-family: 'Lilita One', cursive; font-size: clamp(1.4rem, 6vw, 2.2rem);
  }
  .small-btn {
    font-family: 'Lilita One', cursive; font-size: 1.2rem;
    padding: 8px 22px; border: 4px solid var(--ink); border-radius: 16px;
    background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--ink);
  }
  .small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* answer choices */
  .choices { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .choice {
    flex: 1; min-width: 100px; max-width: 200px; min-height: 100px;
    border: 5px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
    background: var(--sw); color: var(--fg);
    font-family: 'Lilita One', cursive; font-size: 1.4rem; letter-spacing: 1px;
    cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

  /* wheel */
  .wheel-wrap {
    width: 100%; max-width: 420px;
    background: var(--paper);
    border: 5px solid var(--ink); border-radius: 24px; box-shadow: 6px 6px 0 var(--ink);
    padding: 8px;
  }
  .wheel-wrap svg { width: 100%; height: auto; display: block; }
  .seg { stroke: var(--ink); stroke-width: 4; cursor: pointer; transition: transform 0.2s; transform-origin: 200px 200px; }
  .seg.lit { transform: scale(1.1); stroke-width: 6; }
  .seg.dim { opacity: 0.35; }
  .seg-label { font-family: 'Lilita One', cursive; font-size: 17px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .wheel-note { text-align: center; font-weight: 700; color: #8a7560; min-height: 1.6rem; }
</style>
</head>
<body>

<div class="page">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back">🏠</button>
    <div class="screen-title" id="title">🧪 Color Lab!</div>
    <button class="icon-btn" id="listenBtn" aria-label="Listen again" title="Listen">🔊</button>
  </div>

  <!-- MENU -->
  <section class="view active" id="v-menu">
    <button class="mode-card m1" data-goto="mix"><span class="emoji">🎨</span><span>Mix Paint<small>Mix two colors to make a new one</small></span></button>
    <button class="mode-card m2" data-goto="guess"><span class="emoji">🤔</span><span>What Will It Make?<small>Guess the new color</small></span></button>
    <button class="mode-card m3" data-goto="wheel"><span class="emoji">🎡</span><span>Opposite Friends<small>Colors that sit across the wheel</small></span></button>
    <button class="mode-card m4" data-goto="match"><span class="emoji">🧩</span><span>Opposite Match<small>Find the opposite friend</small></span></button>
  </section>

  <!-- MIX -->
  <section class="view" id="v-mix">
    <div class="prompt" id="mixPrompt">Pick <b>two</b> paints!</div>
    <div class="pots" id="mixPots"></div>
    <div class="equation">
      <div class="blob empty" id="slotA"></div><span>+</span>
      <div class="blob empty" id="slotB"></div><span>=</span>
      <div class="blob empty result" id="slotR"></div>
    </div>
    <div class="result-name" id="mixName"></div>
    <button class="small-btn" id="mixReset">Mix again</button>
  </section>

  <!-- GUESS -->
  <section class="view" id="v-guess">
    <div class="prompt" id="guessPrompt">?</div>
    <div class="progress" id="guessPips"></div>
    <div class="equation">
      <div class="blob" id="gA"></div><span>+</span>
      <div class="blob" id="gB"></div><span>=</span>
      <div class="blob empty result" id="gR">?</div>
    </div>
    <div class="choices" id="guessChoices"></div>
  </section>

  <!-- WHEEL -->
  <section class="view" id="v-wheel">
    <div class="prompt" id="wheelPrompt">Tap a color!</div>
    <div class="wheel-wrap"><svg viewBox="0 0 400 400" id="wheelSvg" role="img" aria-label="Color wheel"></svg></div>
    <div class="wheel-note" id="wheelNote">Opposites sit across from each other.</div>
  </section>

  <!-- MATCH -->
  <section class="view" id="v-match">
    <div class="prompt" id="matchPrompt">?</div>
    <div class="progress" id="matchPips"></div>
    <div class="equation">
      <div class="blob" id="mA"></div><span>↔</span>
      <div class="blob empty" id="mB">?</div>
    </div>
    <div class="choices" id="matchChoices"></div>
  </section>
</div>

<div class="confetti-layer" id="confettiLayer"></div>
<div class="cheer" id="cheer">Yay!</div>

<script>
/* ===== SPEECH (Web Speech API, queued) ===== */
const synth = window.speechSynthesis;
let voice = null;
const speechQueue = [];
let speechBusy = false;

function pickVoice() {
  if (!synth) return;
  const voices = synth.getVoices();
  voice = voices.find(v => /en-/i.test(v.lang) && /female|google|samantha|karen|zira/i.test(v.name))
       || voices.find(v => /en-/i.test(v.lang))
       || voices[0];
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = () => { pickVoice(); speakNext(); };
}
function speakNext() {
  if (speechBusy || speechQueue.length === 0) return;
  speechBusy = true;
  const u = speechQueue.shift();
  synth.cancel();
  synth.speak(u);
}
function resetSpeech() {
  if (!synth) return;
  synth.cancel();
  speechQueue.length = 0;
  speechBusy = false;
}
function say(text, pitch = 1.3, rate = 0.9, onend = null) {
  if (!synth) { if (onend) setTimeout(onend, 600); return; }
  if (!voice && synth.getVoices().length > 0) pickVoice();
  const u = new SpeechSynthesisUtterance(String(text));
  if (voice) u.voice = voice;
  u.pitch = pitch; u.rate = rate; u.volume = 1;
  const done = () => { speechBusy = false; if (onend) onend(); speakNext(); };
  u.onend = done; u.onerror = done;
  speechQueue.push(u);
  speakNext();
}
/* iOS/Safari needs a user gesture before speech works */
let unlocked = false;
function unlockAudio() {
  if (unlocked || !synth) return;
  unlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  synth.speak(u);
}
document.body.addEventListener('touchstart', unlockAudio, { once: true });
document.body.addEventListener('click', unlockAudio, { once: true });

/* ===== DATA ===== */
const C = {
  red:    { name: 'Red',    hex: '#E84A45', fg: '#fff' },
  orange: { name: 'Orange', hex: '#F4933E', fg: '#fff' },
  yellow: { name: 'Yellow', hex: '#FCCC3E', fg: '#2B2118' },
  green:  { name: 'Green',  hex: '#6BBE5A', fg: '#fff' },
  blue:   { name: 'Blue',   hex: '#4D9DE0', fg: '#fff' },
  purple: { name: 'Purple', hex: '#A77BCC', fg: '#fff' }
};
const PRIMARIES = ['red', 'yellow', 'blue'];
// paint-style mixing, keyed by the two primaries sorted alphabetically
const MIXES = [
  { a: 'red',    b: 'yellow', out: 'orange' },
  { a: 'blue',   b: 'yellow', out: 'green'  },
  { a: 'blue',   b: 'red',    out: 'purple' }
];
// wheel order (clockwise from top); opposite = index + 3
const WHEEL = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];
const OPPOSITE = { red: 'green', green: 'red', orange: 'blue', blue: 'orange', yellow: 'purple', purple: 'yellow' };
const ROUNDS = 5;
const CHEERS = ['Yay!', 'Wow!', 'Great!', 'Woohoo!', 'Awesome!', 'Hooray!'];
const CONFETTI = ['#FF6B6B','#FFD93D','#4ECDC4','#5B9FE0','#9F7AEA','#95E06C','#FF85B3','#FFA94D'];

/* ===== HELPERS ===== */
const $ = id => document.getElementById(id);
const lc = k => C[k].name.toLowerCase();
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function mixOf(x, y) {
  return MIXES.find(m => (m.a === x && m.b === y) || (m.a === y && m.b === x));
}
function paint(el, key) {
  el.classList.remove('empty');
  el.style.setProperty('--sw', C[key].hex);
  el.style.setProperty('--fg', C[key].fg);
}
function clearBlob(el, text = '') {
  el.classList.add('empty');
  el.style.removeProperty('--sw');
  el.style.removeProperty('--fg');
  el.textContent = text;
}
function renderPips(id, n) {
  $(id).innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<div class="pip ${i < n ? 'on' : ''}"></div>`).join('');
}
function celebrate() {
  const layer = $('confettiLayer');
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = CONFETTI[i % CONFETTI.length];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    layer.appendChild(c);
    setTimeout(() => c.remove(), 4800);
  }
  const cheer = $('cheer');
  cheer.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  cheer.classList.add('show');
  setTimeout(() => cheer.classList.remove('show'), 1400);
}
function choiceHTML(key) {
  return `<button class="choice" style="--sw:${C[key].hex};--fg:${C[key].fg}" data-key="${key}">${C[key].name}</button>`;
}

/* ===== NAVIGATION ===== */
const TITLES = { menu: '🧪 Color Lab!', mix: '🎨 Mix', guess: '🤔 Guess', wheel: '🎡 Wheel', match: '🧩 Match' };
let current = 'menu';
let replay = () => {};

function show(view) {
  resetSpeech();
  current = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + view));
  $('title').textContent = TITLES[view];
  $('backBtn').textContent = view === 'menu' ? '🏠' : '⬅️';
  replay = () => {};
  if (view === 'mix') startMix();
  if (view === 'guess') startGuess();
  if (view === 'wheel') startWheel();
  if (view === 'match') startMatch();
}
$('backBtn').addEventListener('click', () => {
  if (current === 'menu') location.href = '../../index.html';
  else show('menu');
});
$('listenBtn').addEventListener('click', () => replay());
document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => show(b.dataset.goto)));

/* ===== MODE 1: MIX PAINT ===== */
let mixPicks = [], mixLocked = false;

function startMix() {
  $('mixPots').innerHTML = PRIMARIES.map(k =>
    `<button class="pot" style="--sw:${C[k].hex};--fg:${C[k].fg}" data-key="${k}"><span class="e">🪣</span><span class="n">${C[k].name}</span></button>`).join('');
  $('mixPots').querySelectorAll('.pot').forEach(p => p.addEventListener('click', () => onPot(p)));
  $('mixReset').onclick = resetMix;
  resetMix();
  say('Pick two paints to mix!');
}
function resetMix() {
  mixPicks = []; mixLocked = false;
  $('mixPots').querySelectorAll('.pot').forEach(p => p.classList.remove('picked'));
  clearBlob($('slotA')); clearBlob($('slotB')); clearBlob($('slotR'));
  $('slotR').classList.remove('mixing');
  $('mixName').textContent = '';
  $('mixPrompt').innerHTML = 'Pick <b>two</b> paints!';
  replay = () => { resetSpeech(); say('Pick two paints to mix!'); };
}
function onPot(pot) {
  if (mixLocked) return;
  const k = pot.dataset.key;
  if (mixPicks.length === 1 && mixPicks[0] === k) {
    resetSpeech();
    say(`That is ${lc(k)} again. Pick a different paint!`);
    return;
  }
  mixPicks.push(k);
  pot.classList.add('picked');
  paint(mixPicks.length === 1 ? $('slotA') : $('slotB'), k);
  resetSpeech();
  say(C[k].name + '!', 1.4, 0.85);
  if (mixPicks.length === 2) {
    mixLocked = true;
    const [x, y] = mixPicks;
    const m = mixOf(x, y);
    const r = $('slotR');
    setTimeout(() => {
      paint(r, m.out);
      r.classList.remove('mixing'); void r.offsetWidth; r.classList.add('mixing');
      $('mixName').innerHTML = `${C[x].name} + ${C[y].name} = <span style="color:${C[m.out].hex};text-shadow:2px 2px 0 var(--ink)">${C[m.out].name}</span>!`;
      const line = `${C[x].name} and ${lc(y)} make ${lc(m.out)}!`;
      replay = () => { resetSpeech(); say(line); };
      replay();
      celebrate();
    }, 500);
  }
}

/* ===== MODE 2: WHAT WILL IT MAKE? ===== */
let gDone = 0, gLocked = false, gMix = null, gLast = null;

function startGuess() { gDone = 0; gLast = null; renderPips('guessPips', 0); newGuess(); }
function newGuess() {
  gLocked = false;
  let m;
  do { m = shuffle(MIXES)[0]; } while (m === gLast);
  gLast = gMix = m;
  const [x, y] = Math.random() < 0.5 ? [m.a, m.b] : [m.b, m.a];
  paint($('gA'), x); paint($('gB'), y);
  clearBlob($('gR'), '?'); $('gR').classList.add('result');
  $('guessPrompt').innerHTML = `<b>${C[x].name}</b> + <b>${C[y].name}</b> = ?`;
  const wrong = shuffle(Object.keys(C).filter(k => k !== m.out && k !== x && k !== y));
  $('guessChoices').innerHTML = shuffle([m.out, wrong[0], wrong[1]]).map(choiceHTML).join('');
  $('guessChoices').querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => onGuess(b)));
  const q = `What do ${lc(x)} and ${lc(y)} make?`;
  replay = () => { resetSpeech(); say(q); };
  replay();
}
function onGuess(btn) {
  if (gLocked) return;
  const k = btn.dataset.key;
  if (k === gMix.out) {
    gLocked = true;
    btn.classList.add('correct');
    paint($('gR'), k); $('gR').textContent = '';
    gDone++; renderPips('guessPips', gDone);
    resetSpeech();
    say(`Yes! ${C[gMix.a].name} and ${lc(gMix.b)} make ${lc(k)}!`, 1.4, 0.85);
    if (gDone >= ROUNDS) { celebrate(); say('You are a color mixer!', 1.4, 0.9, () => setTimeout(startGuess, 600)); }
    else setTimeout(newGuess, 2400);
  } else {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    resetSpeech();
    say('Hmm, try again!', 1.2, 0.9);
  }
}

/* ===== MODE 3: OPPOSITE FRIENDS (wheel) ===== */
function polar(r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [200 + r * Math.cos(a), 200 + r * Math.sin(a)];
}
function startWheel() {
  const svg = $('wheelSvg');
  const R = 185, r = 55;
  svg.innerHTML = WHEEL.map((k, i) => {
    const a0 = i * 60, a1 = a0 + 60;
    const [x0, y0] = polar(R, a0), [x1, y1] = polar(R, a1), [x2, y2] = polar(r, a1), [x3, y3] = polar(r, a0);
    const [lx, ly] = polar((R + r) / 2, a0 + 30);
    return `<g data-key="${k}" class="seg-g">
      <path class="seg" fill="${C[k].hex}" d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 0 0 ${x3} ${y3} Z"/>
      <text class="seg-label" x="${lx}" y="${ly}" fill="${C[k].fg}">${C[k].name}</text></g>`;
  }).join('') + `<text x="200" y="200" text-anchor="middle" dominant-baseline="middle" font-size="40">🤝</text>`;
  svg.querySelectorAll('.seg-g').forEach(g => g.addEventListener('click', () => onSeg(g.dataset.key)));
  $('wheelPrompt').innerHTML = 'Tap a color!';
  $('wheelNote').textContent = 'Opposites sit across from each other.';
  replay = () => { resetSpeech(); say('Tap a color to find its opposite friend!'); };
  replay();
}
function onSeg(k) {
  const o = OPPOSITE[k];
  document.querySelectorAll('#wheelSvg .seg-g').forEach(g => {
    const key = g.dataset.key, seg = g.querySelector('.seg');
    seg.classList.toggle('lit', key === k || key === o);
    seg.classList.toggle('dim', key !== k && key !== o);
  });
  $('wheelPrompt').innerHTML = `<b>${C[k].name}</b> ↔ <b>${C[o].name}</b>`;
  $('wheelNote').textContent = `${C[k].name} and ${lc(o)} are opposite friends!`;
  replay = () => { resetSpeech(); say(`${C[k].name} and ${lc(o)} are opposite friends!`); };
  replay();
}

/* ===== MODE 4: OPPOSITE MATCH ===== */
let mDone = 0, mLocked = false, mTarget = null, mLast = null;

function startMatch() { mDone = 0; mLast = null; renderPips('matchPips', 0); newMatch(); }
function newMatch() {
  mLocked = false;
  let k;
  do { k = shuffle(WHEEL)[0]; } while (k === mLast);
  mLast = mTarget = k;
  paint($('mA'), k);
  clearBlob($('mB'), '?'); $('mB').classList.add('result');
  $('matchPrompt').innerHTML = `Opposite friend of <b>${C[k].name}</b>?`;
  const wrong = shuffle(WHEEL.filter(x => x !== k && x !== OPPOSITE[k]));
  $('matchChoices').innerHTML = shuffle([OPPOSITE[k], wrong[0], wrong[1]]).map(choiceHTML).join('');
  $('matchChoices').querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => onMatch(b)));
  replay = () => { resetSpeech(); say(`Which color is the opposite friend of ${lc(k)}?`); };
  replay();
}
function onMatch(btn) {
  if (mLocked) return;
  const k = btn.dataset.key;
  if (k === OPPOSITE[mTarget]) {
    mLocked = true;
    btn.classList.add('correct');
    paint($('mB'), k); $('mB').textContent = '';
    mDone++; renderPips('matchPips', mDone);
    resetSpeech();
    say(`Yes! ${C[mTarget].name} and ${lc(k)} are opposite friends!`, 1.4, 0.85);
    if (mDone >= ROUNDS) { celebrate(); say('You found all the opposite friends!', 1.4, 0.9, () => setTimeout(startMatch, 600)); }
    else setTimeout(newMatch, 2400);
  } else {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    resetSpeech();
    say('Hmm, try again!', 1.2, 0.9);
  }
}
</script>
