<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Tap ABC! 🐣</title>

<!-- 
  PURPOSE OF THIS FILE:
  Self-contained "Tap Tap ABC" educational activity for preschoolers.
  - Links to ../../css/common_ui.css for ALL base styling, reset, typography, 
    animations (@keyframes pop/wiggle/float), components (.card, .alpha-btn, .ink-border, .deco, .cheer).
  - Inline <style> now contains ONLY layout/typography overrides specific to letters 
    (large .letter/.emoji sizing, custom .card corner dots, mobile tweaks).
  - JavaScript handles keyboard input, letter cycling, category selection, **and now uses SpeechSynthesis** to read the word aloud when a letter is shown.
  - Uses shared color palette from common_ui.css (:root variables like --red, --yellow, --ink, --pink).
  - Goal: Teach letter recognition with animals/fruits/vehicles via fun tapping and visuals.
-->

<!-- Preload Google Fonts used by common_ui.css and this page -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<!-- Shared UI kit provides reset, body pattern, cards, buttons, animations, etc. -->
<link rel="stylesheet" href="../../css/common_ui.css">

<style>
  /* ================================================
     APP-SPECIFIC STYLES (everything else comes from common_ui.css)
     ================================================ */

  /* Header & title styling */
  header {
    text-align: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(2.4rem, 5.5vw, 4rem);
    color: var(--red);
    letter-spacing: 2px;
    text-shadow:
      3px 3px 0 var(--yellow),
      6px 6px 0 var(--ink);
    transform: rotate(-2deg);
    line-height: 1.1;
  }

  /* Controls (category selector) */
  .controls {
    margin: 18px 0 12px;
    gap: 12px;
  }
  .category-label {
    font-size: 1.15rem;
  }

  /* Main interactive area */
  .stage {
    margin-top: 6px;
  }
  .card {
    border-width: 6px;
    border-radius: 36px;
    padding: 30px 40px;
    box-shadow: 12px 12px 0 var(--yellow), 12px 12px 0 6px var(--ink);
    width: min(560px, 95vw);
    min-height: 440px;
    transform: rotate(-1.2deg);
    transition: box-shadow 0.3s;
    align-items: center;
  }
  /* Decorative corner dots on the card */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 26px; height: 26px;
    border: 4px solid var(--ink);
    border-radius: 50%;
    background: var(--paper);
  }
  .card::before { top: -16px; left: -16px; background: var(--pink); }
  .card::after  { bottom: -16px; right: -16px; background: var(--teal); }

  /* Large display elements inside the card */
  .letter {
    font-size: clamp(7rem, 18vw, 13rem);
    line-height: 0.85;
    margin-bottom: 4px;
    text-align: center;
  }
  .emoji {
    font-size: clamp(4rem, 11vw, 7rem);
    line-height: 1;
    margin: 6px 0 10px;
    text-align: center;
  }
  .word {
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1;
  }

  /* Progress dots showing how many variants exist for current letter */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    min-height: 10px;
  }
  .dot {
    width: 10px; height: 10px;
    background: rgba(43, 33, 24, 0.18);
  }
  .dot.on { background: var(--red); transform: scale(1.3); }

  /* Bottom alphabet keyboard */
  .alphabet-row {
    gap: 7px;
    margin-top: 22px;
    max-width: 920px;
  }
  .alpha-btn {
    width: 46px;
    height: 46px;
    font-size: 1.6rem;
    border-width: 3px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 0;
  }
  .alpha-btn:hover {
    transform: translate(-1px, -1px) rotate(-2deg);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .alpha-btn:active {
    box-shadow: 1px 1px 0 var(--ink);
  }

  /* Floating decorative emojis */
  .deco.d1 { top: 12%; left: 4%; animation-delay: 0s; }
  .deco.d2 { top: 70%; left: 6%; animation-delay: 1.5s; }
  .deco.d3 { top: 18%; right: 5%; animation-delay: 0.7s; }
  .deco.d4 { top: 65%; right: 4%; animation-delay: 2.2s; }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .card { padding: 24px 18px; }
    .alpha-btn { width: 38px; height: 38px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- Floating decorative elements (positioned via common .deco + inline overrides) -->
<div class="deco d1">🌟</div>
<div class="deco d2">🎈</div>
<div class="deco d3">🦋</div>
<div class="deco d4">🌈</div>

<!-- Top bar with Home button -->
<div class="top-bar" style="width:100%; max-width:720px; justify-content:flex-start; margin-bottom:8px;">
  <a href="../../index.html" class="icon-btn" aria-label="Back to Home">🏠</a>
</div>

<!-- Page header -->
<header>
  <h1>🐣 Tap Tap ABC! ✨</h1>
  <div class="subtitle">A little letter playground</div>
</header>

<!-- Category selector (populated from common styles) -->
<div class="controls">
  <label class="category-label" for="category">What shall we learn?</label>
  <select id="category" aria-label="Category">
    <option value="animals">🐾 Animals</option>
    <option value="fruitsveg">🍎 Fruits &amp; Veggies</option>
    <option value="vehicles">🚗 Vehicles</option>
    <option value="body">👃 Body Parts</option>
    <option value="clothes">👕 Clothes</option>
  </select>
</div>

<!-- Main interactive stage -->
<div class="stage">
  <div class="card" id="card">
    <div class="letter" id="letter">?</div>
    <div class="emoji" id="emoji">⌨️</div>
    
    <!-- Word + Listen button (replays the spoken word) -->
    <div style="display:flex; align-items:center; gap:16px; justify-content:center; flex-wrap:wrap;">
      <div class="word" id="word">Press a letter!</div>
      <button class="icon-btn listen-btn" id="listenBtn" aria-label="Listen again" title="Listen">🔊</button>
    </div>
    
    <div class="dots" id="dots"></div>
  </div>
  <div class="hint">Press any letter (A–Z) on the keyboard. Press the same letter again for more!</div>
  <div class="alphabet-row" id="alphabet"></div>
</div>

/* ===== SPEECH SYNTHESIS (Web Speech API) ===== */
const synth = window.speechSynthesis;
let voice = null;

function pickVoice() {
  const voices = synth.getVoices();
  voice = voices.find(v => /en-/i.test(v.lang) && /female|google|samantha|karen|zira/i.test(v.name))
       || voices.find(v => /en-/i.test(v.lang))
       || voices[0];
}

if (synth) {
  pickVoice();
  synth.onvoiceschanged = pickVoice;
}

function say(text, pitch = 1.35, rate = 0.9) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(String(text));
  if (voice) u.voice = voice;
  u.pitch = pitch;
  u.rate = rate;
  u.volume = 1;
  synth.speak(u);
}

/* Unlock audio on first user interaction (required on iOS/Safari) */
let unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  synth && synth.speak(u);
}
document.body.addEventListener('touchstart', unlockAudio, { once: true });
document.body.addEventListener('click', unlockAudio, { once: true });

// Color cycle for letter display (maps A-Z to our unified palette)
const COLORS = ['var(--red)','var(--orange)','var(--yellow)','var(--green)','var(--teal)','var(--blue)','var(--purple)','var(--pink)'];

let currentCategory = 'animals';
let currentLetter = null;
let currentIndex = 0;

// Helper to get DOM elements by ID
const $ = id => document.getElementById(id);

// Cache frequently used elements
const letterEl = $('letter');
const emojiEl  = $('emoji');
const wordEl   = $('word');
const dotsEl   = $('dots');
const cardEl   = $('card');
const categorySel = $('category');
const alphabetEl  = $('alphabet');
const listenBtn = $('listenBtn');

// Dynamically build the A–Z button row using common .alpha-btn styles
for (let i = 65; i <= 90; i++) {
  const letter = String.fromCharCode(i);
  const btn = document.createElement('button');
  btn.className = 'alpha-btn';
  btn.textContent = letter;
  btn.dataset.letter = letter;
  btn.addEventListener('click', () => showLetter(letter));
  alphabetEl.appendChild(btn);
}

// Listen button replays the current word
listenBtn.addEventListener('click', () => {
  const currentWord = wordEl.textContent;
  if (currentWord && currentWord !== 'Press a letter!') {
    say(currentWord, 1.35, 0.9);
  }
});

/**
 * Main function: display a letter, cycle examples on repeat press.
 * Updates card shadow with color, triggers pop animation, shows dots if multiple examples.
 */
function showLetter(letter) {
  letter = letter.toUpperCase();
  if (!/^[A-Z]$/.test(letter)) return;

  // Cycle if same letter; reset index if new letter
  if (letter === currentLetter) {
    currentIndex++;
  } else {
    currentLetter = letter;
    currentIndex = 0;
  }

  const items = (DATA[currentCategory] && DATA[currentCategory][letter]) || [];
  let word, emoji;
  if (items.length === 0) {
    word = 'Hmm…';
    emoji = '🤔';
    currentIndex = 0;
  } else {
    const item = items[currentIndex % items.length];
    word  = item[0];
    emoji = item[1];
  }

  // Apply color from unified palette to card shadow for visual feedback
  const color = COLORS[(letter.charCodeAt(0) - 65) % COLORS.length];
  cardEl.style.boxShadow = `12px 12px 0 ${color}, 12px 12px 0 6px var(--ink)`;

  // Trigger CSS pop animation (defined in common_ui.css)
  cardEl.classList.remove('animate');
  void cardEl.offsetWidth; // force reflow
  cardEl.classList.add('animate');

  // Update displayed content
  letterEl.textContent = letter;
  emojiEl.textContent  = emoji;
  wordEl.textContent   = word;

  // Speak the word aloud (using the shared speech system)
  if (word !== 'Hmm…' && word !== 'Press a letter!') {
    say(word);
  }

  // Show cycle indicator dots when multiple examples exist
  dotsEl.innerHTML = '';
  if (items.length > 1) {
    for (let k = 0; k < items.length; k++) {
      const d = document.createElement('div');
      d.className = 'dot' + (k === (currentIndex % items.length) ? ' on' : '');
      dotsEl.appendChild(d);
    }
  }

  // Highlight and wiggle the active alphabet button
  document.querySelectorAll('.alpha-btn').forEach(b => {
    const isActive = b.dataset.letter === letter;
    b.classList.toggle('active', isActive);
    if (isActive) {
      b.classList.remove('wiggle');
      void b.offsetWidth;
      b.classList.add('wiggle');
    }
  });
}

// Global keyboard support (A–Z only). Ignores input when select is focused.
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'SELECT') return;
  if (e.key && e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) {
    showLetter(e.key);
  }
});

// Update category and refresh current letter display
categorySel.addEventListener('change', (e) => {
  currentCategory = e.target.value;
  if (currentLetter) {
    const prev = currentLetter;
    currentLetter = null;
    showLetter(prev);
  }
  document.body.focus();
  categorySel.blur();
});

// Make body focusable so keyboard events always work after clicking elsewhere
document.body.tabIndex = -1;
</script>
